
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PyScript CSS -->
        <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
        <!-- This script tag bootstraps PyScript -->
        <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
        <!-- BOOTSTRAP -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- CSS -->
        <link rel="stylesheet" href="style.css">
    <!-- google fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>Seatwork 1 Membership Checker</title>

    <style>
        :root {
            --burgundy: #570d24;
            --wine: #791b36;
            --gold: #d9b56d;
            --cream: #f8f0df;
            --dark: #180c12;
            --muted: #bba9a7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            color: var(--cream);
            background:
                radial-gradient(ellipse at 50% 35%, #612039 0%, transparent 55%),
                linear-gradient(135deg, #160b11, #32101e 55%, #12090e);
            overflow-x: hidden;
        }

        /* theater curtains */
        body::before,
        body::after {
            content: "";
            position: fixed;
            top: 0;
            bottom: 0;
            width: 12px;
            background: linear-gradient(
                90deg,
                #2c0713,
                #791b36,
                #4b0b20,
                #260611
            );
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        body::before {
            left: 0;
        }

        body::after {
            right: 0;
        }

        /* header */
        header {
            text-align: center;
            padding: 35px 20px 20px;
        }

        .top-label {
            color: var(--gold);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
        }

        .theater-masks {
            margin: 15px 0 5px;
            font-size: 2.8rem;
            filter: drop-shadow(0 0 12px rgba(217, 181, 109, 0.25));
        }

        header h1 {
            margin: 8px 0;
            font-family: 'Cinzel', serif;
            font-size: clamp(1.6rem, 5vw, 3rem);
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--gold);
        }

        header p {
            margin: 8px 0;
            color: #e2d2ce;
            font-size: 0.9rem;
            letter-spacing: 0.12em;
        }

        .gold-line {
            width: 100px;
            height: 2px;
            margin: 20px auto 0;
            background: var(--gold);
        }

        /* main stage */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 18px 50px;
        }

        .ticket {
            position: relative;
            width: 100%;
            max-width: 480px;
            padding: 34px;
            color: var(--dark);
            background: var(--cream);
            border: 2px solid var(--gold);
            border-radius: 5px;
            box-shadow:
                0 0 0 7px rgba(217, 181, 109, 0.08),
                0 20px 70px rgba(0, 0, 0, 0.45);
        }

        /* ticket details */
        .ticket::before,
        .ticket::after {
            content: "";
            position: absolute;
            top: 58%;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #28101b;
        }

        .ticket::before {
            left: -12px;
        }

        .ticket::after {
            right: -12px;
        }

        .ticket-heading {
            text-align: center;
        }

        .ticket-heading .eyebrow {
            margin: 0;
            color: var(--wine);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
        }

        .ticket-heading h2 {
            margin: 10px 0;
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: var(--burgundy);
        }

        .ticket-heading p {
            margin: 0;
            color: #78636a;
            font-size: 0.88rem;
        }

        .ticket-divider {
            margin: 25px 0;
            border: 0;
            border-top: 2px dashed #c6b6a6;
        }

        /* form */
        form {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        label {
            margin-top: 8px;
            color: #46202e;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            color: var(--dark);
            background: #fffaf1;
            border: 1px solid #d5c5b6;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]::placeholder {
            color: #a39491;
        }

        input[type="text"]:focus {
            border-color: var(--wine);
            box-shadow: 0 0 0 3px rgba(121, 27, 54, 0.1);
        }

        input[type="button"] {
            width: 100%;
            margin-top: 17px;
            padding: 15px 12px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--cream);
            background: linear-gradient(135deg, #791b36, #4b0b20);
            border: 1px solid var(--gold);
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        input[type="button"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(87, 13, 36, 0.25);
        }

        input[type="button"]:active {
            transform: translateY(0);
        }

        /* result */
        #result {
            margin-top: 20px;
            padding: 15px;
            color: var(--burgundy);
            background: #f0e2c7;
            border-left: 4px solid var(--gold);
            border-radius: 3px;
            font-size: 0.92rem;
            font-weight: 600;
            line-height: 1.6;
            text-align: center;
            overflow-wrap: anywhere;
        }

        #result:empty {
            display: none;
        }

        .ticket-bottom {
            margin-top: 25px;
            padding-top: 16px;
            border-top: 1px solid #d5c5b6;
            color: #876f71;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-align: center;
            text-transform: uppercase;
        }

        /* footer */
        footer {
            padding: 18px 15px;
            color: #d7c6c3;
            background: rgba(10, 5, 8, 0.55);
            border-top: 1px solid rgba(217, 181, 109, 0.35);
            font-size: 0.75rem;
            line-height: 1.8;
            text-align: center;
        }

        footer span {
            color: var(--gold);
        }

        /* mobile layout */
        @media (max-width: 480px) {
            header {
                padding-top: 28px;
            }

            .ticket {
                padding: 25px 22px;
            }

            header p {
                letter-spacing: 0.04em;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="top-label">The stage is yours</div>
        <div class="theater-masks" aria-label="theater masks">🎭</div>
        <h1>Spotlight</h1>
        <p>OBMC THEATER CLUB MEMBERSHIP CHECKER</p>
        <div class="gold-line"></div>
    </header>

    <main>
        <section class="ticket">
            <div class="ticket-heading">
                <p class="eyebrow">Official membership pass</p>
                <h2>Step Into the Spotlight</h2>
                <p>Verify your name to discover if you're on our cast list.</p>
            </div>

            <hr class="ticket-divider">

            <form>
                <label for="first_name">First Name</label>
                <input
                    type="text"
                    id="first_name"
                    placeholder="Enter your first name"
                    autocomplete="given-name"
                    required
                >

                <label for="last_name">Last Name</label>
                <input
                    type="text"
                    id="last_name"
                    placeholder="Enter your last name"
                    autocomplete="family-name"
                    required
                >

                <input
                    type="button"
                    py-click="verify_candidate"
                    value="Verify Membership"
                >
            </form>

            <div id="result" aria-live="polite"></div>

        </section>
    </main>

    <footer>
        &copy; 2026–2027 <span>Spotlight Theater Club</span><br>
        Nicole Manalang · 10-Emerald
    </footer>

    <py-script src="main.py"></py-script>
</body>
</html>
